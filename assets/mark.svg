<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="MagicAds">
  <title>MagicAds</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#fundo)"/>

  <!-- chapeu de mago, estilo quadrinho: contorno grosso, fundo chapado.
       Ordem importa: cone, faixa, aba. A aba desenhada por ultimo cobre a base
       do cone e e o que da a leitura de "chapeu" e nao de "cone". -->
  <g stroke="#1E1B4B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 88 C44 62 54 40 70 26 C78 19 90 14 96 20 C98 27 88 32 80 34 C79 52 80 70 84 88 Z" fill="url(#ouro)"/>
  </g>

  <!-- brilho no cone. Vem ANTES da faixa e da aba de proposito: desenhado por
       ultimo, ele atravessa a faixa escura e vira um risco branco no meio. -->
  <path d="M46 84 C50 62 58 44 68 32 C64 46 57 64 55 85 Z" fill="#FFFFFF" opacity=".32"/>

  <g stroke="#1E1B4B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50 58 C60 64 70 64 80 58 L81 71 C71 77 59 77 49 71 Z" fill="#1E1B4B"/>
    <path d="M14 92 C14 82 35 76 62 76 C89 76 110 82 110 92 C110 102 89 108 62 108 C35 108 14 102 14 92 Z" fill="url(#ouro)"/>
  </g>

  <!-- estrela no chapeu: escura, porque branco sobre ouro some -->
  <path d="M67 40c.87 3.87 2.13 5.13 6 6-3.87.87-5.13 2.13-6 6-.87-3.87-2.13-5.13-6-6 3.87-.87 5.13-2.13 6-6z" fill="#1E1B4B"/>

  <!-- faiscas -->
  <path d="M22 22c1.17 5.17 2.83 6.83 8 8-5.17 1.17-6.83 2.83-8 8-1.17-5.17-2.83-6.83-8-8 5.17-1.17 6.83-2.83 8-8z" fill="#FFFFFF"/>
  <path d="M114 34.5c.8 3.55 1.95 4.7 5.5 5.5-3.55.8-4.7 1.95-5.5 5.5-.8-3.55-1.95-4.7-5.5-5.5 3.55-.8 4.7-1.95 5.5-5.5z" fill="#FFFFFF" opacity=".85"/>
</svg>
