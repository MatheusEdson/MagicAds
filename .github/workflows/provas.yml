# As garantias do README, verificadas a cada push.
#
# Tem hook de pre-push em scripts/hooks/, mas hook depende de quem clonou ter
# instalado. Quem forka nao instala, e ai a promessa de "nenhum segredo no repo"
# passa a valer so na sua maquina.
name: provas

on:
  push:
  pull_request:

# Este workflow so le. Sem isto o GITHUB_TOKEN nasce com a permissao padrao do
# repositorio, que pode ser write -- e ai qualquer Action de terceiro que entrar
# aqui um dia herda permissao de escrever no repo. Barato agora, caro depois.
permissions:
  contents: read

jobs:
  testes:
    name: testes · py${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 e o piso que o README promete. Prometer versao e nunca rodar
          # nela e o mesmo que dizer "sem dependencia" sem nunca ter instalado
          # limpo. (3.8 nao existe no runner 24.04, por isso o 22.04 fixo.)
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          # Windows porque e onde este projeto e operado de verdade, e caminho
          # e encoding sao justamente o que quebra so la.
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: sem pip install, de proposito
        run: python -m unittest discover -s tests -v

  scrub:
    name: nenhum segredo, nenhum dado de cliente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scrub.sh

  historico:
    name: nem no historico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SEM isto o checkout traz 1 commit, e a varredura assinaria
          # "historico limpo" sem ter visto historico nenhum. O script
          # recusa clone raso justamente por isso, entao a falta daqui
          # aparece como erro, nao como verde falso.
          fetch-depth: 0
      # Segredo que entrou num commit e saiu no seguinte some da arvore e
      # continua no pack. O scrub acima nao ve; este ve.
      - run: bash scripts/historico.sh

  receitas:
    name: as receitas de exemplo sobem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ensaio nao chama a Meta: monta os payloads e imprime. Exemplo quebrado
      # e pior que exemplo ausente, porque quem copia nao desconfia.
      - name: ensaio de cada receita
        run: |
          for r in receitas/*.json; do
            echo "::group::$r"
            python -m magicads subir "$r"
            echo "::endgroup::"
          done

  agentes:
    name: os agentes nao citam comando inexistente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PyYAML NAO e dependencia do MagicAds -- ele roda sem instalar nada. E
      # dependencia DESTE job, so pra validar o bloco yaml dos agentes: um bloco
      # que se anuncia como yaml e nao e vira armadilha pra primeira ferramenta
      # que tentar le-lo. (Hoje ninguem parseia: no Claude Code o arquivo vira
      # prompt e o modelo le como texto.)
      - run: python -m pip install --quiet pyyaml
      - run: python -m unittest tests.test_agentes -v
